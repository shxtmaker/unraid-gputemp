# gputemp 默认配置（default.cfg）
# 本文件随 .txz 包安装至 RAM disk，每次开机重建，运行时只读。
# 用户配置经 parse_plugin_cfg('gputemp') 与本文件合并（用户值优先，缺键回退至此）。
# 格式：KEY="value"，与 /boot/config/plugins/gputemp/gputemp.cfg 一致。

# 仪表盘温度刷新周期（秒），可选档位 1 / 2 / 5 / 10
REFRESH_INTERVAL="5"

# 警告级超温阈值（整数摄氏度），温度高于该值显示警告色
TEMP_WARN="65"

# 临界级超温阈值（整数摄氏度），须满足 0 < TEMP_WARN < TEMP_CRIT <= 120
TEMP_CRIT="85"

# 启用显示的显卡白名单（逗号分隔 PCI 地址，如 0000:01:00.0,0000:02:00.0）
# 空串表示显示全部检测到的受支持设备；白名单为显示规则之后的第二层过滤
ENABLED_GPUS=""

# 单次采集超时阈值（秒，取值 1~30），超时即判为本次采集失败
COLLECT_TIMEOUT="5"

# 连续失败降级阈值（次，>=1），某卡连续失败达该次数后停止采集并标注不可用
FAIL_THRESHOLD="3"
